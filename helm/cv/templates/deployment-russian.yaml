apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.russian.name }}
  labels:
    app: {{ .Values.russian.name }}
spec:
  replicas: {{ .Values.russian.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.russian.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.russian.name }}
    spec:
      containers:
      - name: cv-app
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command: ["http-server", "./public-rus", "-p", "6003"]
        ports:
        - containerPort: {{ .Values.russian.containerPort }}
          name: http
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 60
          periodSeconds: 20
          failureThreshold: 3
        resources:
          {{- toYaml .Values.russian.resources | nindent 10 }}

